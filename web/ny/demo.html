<main id="app" aria-live="polite"></main>
<script>
// ----- from js/scams.js -----
// The scan check's knowledge and logic: reported scams with fair rates and prices, and the verdict.
// Same rules as the Android app (features/scancheck/ScanJudge.kt): the AI may only READ a photo;
// she confirms the number, and plain math against these saved numbers decides. Demo data, approximate.

const KINDS = ["Money", "Taxi", "Tour", "Shop", "Ticket", "Other"];


const STOP = new Set(["the", "you", "your", "for", "and", "with", "only", "this", "that", "are", "from", "not", "after", "before", "please", "thank", "than", "get", "its", "our"]);
const words = (s) => new Set(String(s).toLowerCase().split(/[^\p{L}\p{N}%]+/u).filter((w) => w.length >= 3 && !STOP.has(w)));
const n2 = (x) => x.toFixed(2);

// "4,20" -> 4.2 and "1,500" -> 1500: a comma is a decimal point only when 1-2 digits follow it.
function parseNumber(text) {
  const t = String(text).trim();
  const n = Number(/,\d{1,2}$/.test(t) ? t.replace(/\./g, "").replace(",", ".") : t.replace(/,/g, ""));
  return t && Number.isFinite(n) ? n : null;
}

const LABEL = { fair: "Looks fair", careful: "Be careful", walk: "Walk away", unknown: "Nothing saved about this" };
const TIP = { Money: "Use a bank ATM and decline the conversion it offers.", Taxi: "Use the official taxi desk or a ride app, and agree the price first.",
  Tour: "Agree the full price before you start.", Shop: "Check the amount on the card machine before you pay.",
  Ticket: "Buy tickets only at the official counter.", Other: "If someone insists, say no and keep walking." };

// reading: { kind, text, rate: {from, to, buy}?, price: {currency, amount}? } -> { verdict, why, whatToDo, saferOption, warning }
function judge(reading, scams) {
  const result = (verdict, why, w) => ({ verdict, why, whatToDo: w.whatToDo, saferOption: w.saferOption || "", warning: w });
  const r = reading.rate;
  if (r?.buy != null) for (const w of scams) {
    const fair = (w.fairRates || []).find((f) => f.from.toLowerCase() === r.from.toLowerCase() && f.to.toLowerCase() === r.to.toLowerCase());
    if (!fair) continue;
    const loss = Math.round(((fair.rate - r.buy) / fair.rate) * 100);
    const verdict = loss < 3 ? "fair" : loss <= fair.walkAwayLossPercent ? "careful" : "walk";
    const lossText = loss > 0 ? ` You'd lose about ${loss}% (100 ${fair.from} → ${Math.round(r.buy * 100)} ${fair.to}, not ${Math.round(fair.rate * 100)}).` : "";
    return result(verdict, `They buy 1 ${fair.from} for ${n2(r.buy)} ${fair.to}. A fair rate is about ${n2(fair.rate)}.${lossText}`, w);
  }
  const p = reading.price;
  if (p?.amount != null) for (const w of scams) {
    const fair = (w.fairPrices || []).find((f) => f.currency.toLowerCase() === p.currency.toLowerCase() && w.kind === reading.kind);
    if (!fair) continue;
    const verdict = p.amount <= fair.high ? "fair" : p.amount <= fair.high * 1.5 ? "careful" : "walk";
    return result(verdict, `They ask ${Math.round(p.amount)} ${fair.currency} for ${fair.item}. A fair price is about ${fair.low}–${fair.high} ${fair.currency}.`, w);
  }
  // No numbers: match what the sign says against the saved signs. Never "Looks fair" from words alone.
  const text = (reading.text || "").toLowerCase();
  if (text.trim()) {
    const seen = words(text);
    const scored = scams.map((w) => {
      const cues = w.signs || w.looksLike || []; // Reddit-researched items describe what they look like
      const phrase = cues.some((s) => text.includes(s.toLowerCase()));
      const shared = [...words([w.title, ...cues].join(" "))].filter((x) => seen.has(x)).length;
      return { w, ok: phrase || shared >= 2, score: (phrase ? 10 : 0) + shared };
    }).filter((s) => s.ok).sort((a, b) => b.score - a.score);
    if (scored[0]) { const w = scored[0].w; return result(w.level === "Avoid" ? "walk" : "careful", w.whatHappens || `${w.title}, reported in ${w.where}.`, w); }
  }
  return { verdict: "unknown", why: LABEL.unknown, whatToDo: TIP[reading.kind] || TIP.Other, saferOption: "", warning: null };
}

// The saved place Beacon recommends for a question, picked in code so the map blinks the same one the answer names.
function recommends(question) {
  const q = question.toLowerCase();
  return /\b(safe|where|go|help|hostel|hospital|walk)\b/.test(q) || q.includes("police station");
}

}
const dist = (m) => (m < 1000 ? `${m} m` : `${(m / 1000).toFixed(1)} km`);
const nearestOf = (kinds = ["police", "hospital"]) => places.filter((p) => kinds.includes(p.kind)).map((p) => ({ ...p, meters: meters(here, p) })).sort((a, b) => a.meters - b.meters)[0];
function toast(text) { const t = document.createElement("div"); t.className = "toast"; t.textContent = text; document.body.append(t); setTimeout(() => t.remove(), 2200); }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast("Copied. Paste it into your messages."); } catch { toast("Couldn't copy here. Select the text and copy it."); } }

// ---------- The drawn Manhattan map (metres from a corner, like the Lapa drawing; not to scale in detail) ----------
const X = (lng) => (lng + 74.03) * 84400 / 20, Y = (lat) => (40.83 - lat) * 111000 / 20;
const LNG = (x) => x * 20 / 84400 - 74.03, LAT = (y) => 40.83 - y * 20 / 111000;
const ISLAND = [[40.7005,-74.0160],[40.7090,-74.0190],[40.7300,-74.0110],[40.7520,-74.0090],[40.7700,-73.9960],[40.7900,-73.9810],[40.8100,-73.9690],[40.8300,-73.9530],
  [40.8300,-73.9370],[40.8050,-73.9300],[40.7920,-73.9380],[40.7760,-73.9420],[40.7600,-73.9580],[40.7460,-73.9700],[40.7280,-73.9720],[40.7110,-73.9780],[40.7070,-73.9990]];
const PARK = [[40.7681,-73.9819],[40.7968,-73.9493],[40.8003,-73.9582],[40.7644,-73.9730]];
const pts = (list) => list.map(([la, ln]) => `${X(ln).toFixed(1)},${Y(la).toFixed(1)}`).join(" ");
function mapSvg(highlight) {
  const cx = X(here.lng), cy = Y(here.lat), w = 210 / zoom, h = 260 / zoom;
  const grid = [];
  for (let i = -40; i <= 40; i++) grid.push(`<line x1="${i * 13}" y1="-700" x2="${i * 13}" y2="700" stroke-width="${i % 2 ? 1.6 : 3}"/>`);
  for (let j = -90; j <= 90; j++) grid.push(`<line x1="-700" y1="${j * 8}" x2="700" y2="${j * 8}" stroke-width="${j % 5 ? 1 : 2.4}"/>`);
  const badge = (p) => `<g><rect x="${X(p.lng) - 6}" y="${Y(p.lat) - 6}" width="12" height="12" rx="4" fill="#fff"/><rect x="${X(p.lng) - 5}" y="${Y(p.lat) - 5}" width="10" height="10" rx="3" fill="${COLOR[p.kind]}"/>${p.kind === "hospital" ? `<path d="M${X(p.lng) - 3} ${Y(p.lat)}h6M${X(p.lng)} ${Y(p.lat) - 3}v6" stroke="#fff" stroke-width="1.6"/>` : `<circle cx="${X(p.lng)}" cy="${Y(p.lat)}" r="1.8" fill="#fff"/>`}</g>`;
  const label = (p) => zoom >= 1.5 ? `<text x="${X(p.lng)}" y="${Y(p.lat) + 12}" font-size="${6 / Math.sqrt(zoom)}" text-anchor="middle" fill="#3C4658" stroke="#fff" stroke-width="1.6" paint-order="stroke" font-family="Inter,sans-serif" font-weight="600">${esc(p.name)}</text>` : "";
  const ring = highlight ? `<circle class="go-here" cx="${X(highlight.lng)}" cy="${Y(highlight.lat)}" r="12"/>` : "";
  return `<svg viewBox="${cx - w / 2} ${cy - h / 2} ${w} ${h}" preserveAspectRatio="xMidYMid slice" id="map" role="img" aria-label="Map of Manhattan. Tap to set where you are.">
    <defs><clipPath id="isl"><polygon points="${pts(ISLAND)}"/></clipPath></defs>
    <rect x="-200" y="-200" width="1000" height="1200" fill="#B9E0F7"/>
    <polygon points="${pts(ISLAND)}" fill="#E9EBEE"/>
    <g clip-path="url(#isl)"><g transform="rotate(29 ${X(-73.985)} ${Y(40.758)}) translate(${X(-73.985)} ${Y(40.758)})" stroke="#fff">${grid.join("")}</g></g>
    <polygon points="${pts(PARK)}" fill="#CFE6CB"/>
    <text x="${X(-73.966)}" y="${Y(40.782)}" font-size="7" text-anchor="middle" fill="#5E9B6B" font-family="Sora,sans-serif" font-weight="600" transform="rotate(-61 ${X(-73.966)} ${Y(40.782)})">CENTRAL PARK</text>
    ${places.map(badge).join("")}${places.map(label).join("")}${ring}
    <circle class="pulse" cx="${cx}" cy="${cy}" r="${9 / zoom}" fill="#22A06B" opacity=".2"/>
    <circle cx="${cx}" cy="${cy}" r="${5.5 / zoom}" fill="#fff"/><circle cx="${cx}" cy="${cy}" r="${4 / zoom}" fill="#22A06B"/>
  </svg>`;
}

// ---------- Home ----------
function home(highlightName = null) {
  const shown = places.find((p) => p.name === highlightName) || null;
  const card = shown ? { ...shown, meters: meters(here, shown) } : nearestOf();
  app.innerHTML = `
    <div class="mapwrap">${mapSvg(shown)}
      <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
      <div class="hint">Tap the map to say where you are</div></div>
    <div class="sheet"><div class="grab"></div>
      <button class="askbar" id="ask"><span>Ask Beacon anything</span><i class="sq">→</i></button>
      <div class="chips">${["Where can I get help?", "I think I'm being followed"].map((q) => `<button class="chip" data-q="${q}">${q}</button>`).join("")}</div>
      <button class="card" id="place"><i class="dot" style="background:${COLOR[card.kind]}"></i><div><div class="label">${esc(card.name)} · ${dist(card.meters)}</div><p class="small">${KIND_LABEL[card.kind]} · open 24 hours</p></div></button>
      <div class="three"><button id="ok">✓ I'm OK</button><button id="scan">Scan</button><button id="call">911</button></div>
      <button class="btn red" id="sos">SOS</button>
      <p class="small">Demo page: no location, no sending. Places are approximate. In an emergency, call 911.</p>
    </div>`;
  const svg = $("#map");
  svg.onclick = (e) => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    here.lat = LAT(p.y); here.lng = LNG(p.x); home();
  };
  $("#zin").onclick = (e) => { e.stopPropagation(); zoom = Math.min(4, zoom * 1.6); home(highlightName); };
  $("#zout").onclick = (e) => { e.stopPropagation(); zoom = Math.max(0.5, zoom / 1.6); home(highlightName); };
  $("#ask").onclick = () => ask("");
  app.querySelectorAll("[data-q]").forEach((b) => (b.onclick = () => ask(b.dataset.q)));
  $("#place").onclick = () => home(card.name);
  $("#ok").onclick = () => copy(`I'm OK · ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })} · near ${nearestOf().name}, New York`);
  $("#call").onclick = () => toast("Call 911 from your phone's dialer.");
  $("#scan").onclick = () => scan();
  $("#sos").onclick = () => sos();
}

// ---------- Ask Beacon: Claude answers from the saved facts; plain rules when Claude isn't available ----------
function facts() {
  const p = nearestOf(["police"]), h = nearestOf(["hospital"]);
  return `Emergency (police, fire, ambulance): 911. Non-emergency city help: 311.
Closest police station: ${p.name}, ${dist(p.meters)} away, open 24 hours.
Closest hospital: ${h.name}, ${dist(h.meters)} away, open 24 hours.
Scams reported in New York (city investigations, news, travel guides):
${ny.scams.map((s) => `- ${s.title} (${s.where}). ${s.whatHappens || ""} Reports say: ${s.travelersSay || "-"} What to do: ${s.whatToDo}`).join("\n")}`;
}
function plainAnswer(question) {
  const q = question.toLowerCase(), place = nearestOf(), h = nearestOf(["hospital"]);
  if (/follow|unsafe|scared|danger/.test(q)) return `Go into a busy shop, hotel lobby or restaurant now and stay where people are. ${place.name} is ${dist(place.meters)} away. If you're in danger, call 911.`;
  if (/hurt|hospital|doctor|bleed|sick/.test(q)) return `If it's serious, call 911. The nearest hospital is ${h.name}, ${dist(h.meters)} away.`;
  const scam = judge({ kind: "Other", text: q }, ny.scams);
  if (scam.warning) return `${scam.warning.title} is a known scam (${scam.warning.where}). ${scam.whatToDo}`;
  if (recommends(question)) return `${place.name} is ${dist(place.meters)} away and open 24 hours. Walk there on a busy, lit street. In an emergency, call 911.`;
  if (/police|number|emergency|call/.test(q)) return "Emergency (police, fire, ambulance): 911. For non-emergencies, call 311.";
  return "I don't have that saved. In an emergency, call 911.";
}
const chat = [];
function ask(question) {
  let thinking = false;
  const draw = () => {
    app.innerHTML = `<div class="screen" style="gap:0">
      <div class="top"><button class="link" id="back">← Map</button><h2 style="margin-left:auto;margin-right:auto">Ask Beacon</h2></div>
      <div class="bubbles" id="bubbles">
        ${chat.map((l) => `<div class="bubble ${l.you ? "you" : "beacon"}">${esc(l.text)}</div>${l.place ? `<button class="link" data-place="${esc(l.place)}">Show ${esc(l.place)} on the map</button>` : ""}`).join("")}
        ${thinking ? '<div class="bubble beacon">…</div>' : ""}
        ${chat.length || thinking ? "" : `<div class="chips" style="justify-content:center">${["Where can I get help?", "Is a ticket seller in Battery Park legit?", "What's the emergency number?"].map((q) => `<button class="chip" data-q="${q}">${q}</button>`).join("")}</div>`}
      </div>
      <form class="askbar" id="form"><input id="box" placeholder="Ask Beacon anything" autocomplete="off" aria-label="Your question"><button class="sq" aria-label="Send">→</button></form>
    </div>`;
    $("#back").onclick = () => home();
    $("#form").onsubmit = (e) => { e.preventDefault(); send($("#box").value); };
    app.querySelectorAll("[data-q]").forEach((b) => (b.onclick = () => send(b.dataset.q)));
    app.querySelectorAll("[data-place]").forEach((b) => (b.onclick = () => home(b.dataset.place)));
    const box = $("#bubbles"); box.scrollTop = box.scrollHeight;
  };
  const send = async (text) => {
    text = text.trim();
    if (!text || thinking) return;
    const pick = recommends(text) ? nearestOf() : null;
    chat.push({ you: true, text }); thinking = true; draw();
    let reply = null;
    if (sample) {
      try {
        const earlier = chat.slice(-5, -1).map((l) => `${l.you ? "Traveler" : "Beacon"}: ${l.text}`).join("\n") || "(nothing yet)";
        const r = await sample(`You are Beacon, a calm safety helper for a traveler in New York. Answer using ONLY the facts below. Copy names and numbers exactly.
If the facts don't cover it, say "I don't have that saved. In an emergency, call 911." At most 3 short steps, plain words, no headings, no markdown.${pick ? `\nRecommend ${pick.name} first.` : ""}
FACTS
${facts()}
EARLIER
${earlier}
QUESTION: ${text}`, { modelTier: "quick", cache: false });
        reply = r.text?.trim() || null;
      } catch (e) { if (e?.code === "not_granted") sample = null; }
    }
    chat.push({ you: false, text: reply ?? plainAnswer(text), place: pick?.name || null }); thinking = false; draw();
  };
  draw();
  if (question) send(question);
}

// ---------- Scan: is this legit? Claude matches the photo to a scam travelers report; no price needed ----------
// The verdict comes from the saved warning that matched (its level), never from the AI's opinion.
// A price is optional: scammers rarely say it up front. If you add one, the fair price (when saved) is compared too.
const DOT = { fair: "var(--green)", careful: "var(--yellow)", walk: "var(--amber)", unknown: "var(--muted)" };
const verdictOf = (w) => ({ verdict: w.level === "Avoid" ? "walk" : "careful", why: w.whatHappens || `${w.title}, reported in ${w.where}.`, whatToDo: w.whatToDo, saferOption: w.saferOption || "", warning: w });
function scan() {
  const s = { step: "start", photo: null, seen: "", verdict: null, badge: "", note: "", showPrice: false };
  const draw = () => {
    const v = s.verdict, w = v?.warning;
    const body = {
      start: () => `<p>Take or choose a photo of what's in front of you: a pedicab, a ticket seller, a character, a sign. Beacon checks it against scams reported in New York by city investigators, news and travel guides.</p>
        <label class="btn">Choose a photo<input id="photo" type="file" accept="image/*" hidden></label>
        <button class="link" id="type">Describe it instead</button>`,
      reading: () => `<p>Looking at your photo…</p>`,
      describe: () => `<div class="card col">${s.note ? `<p class="small">${esc(s.note)}</p>` : ""}<h2>What do you see?</h2>
        <input class="field" id="what" placeholder="e.g. a guy selling Statue of Liberty tickets" value="${esc(s.seen)}">
        <button class="btn" id="check">Check it</button></div>`,
      verdict: () => `<div class="card col">
        ${s.seen ? `<p class="small">What we see: ${esc(s.seen)}</p>` : ""}
        <div class="row"><i class="dot" style="background:${DOT[v.verdict]}"></i><h1 style="flex:1">${LABEL[v.verdict]}</h1>${s.badge ? `<span class="small">${esc(s.badge)}</span>` : ""}</div>
        ${w ? `<div class="label">${esc(w.title)}</div>` : ""}
        ${v.why !== LABEL[v.verdict] ? `<p>${esc(v.why)}</p>` : ""}
        ${w?.travelersSay ? `<p><b>Reports say:</b> ${esc(w.travelersSay)}</p>` : ""}
        <p><b>What to do:</b> ${esc(v.whatToDo)}</p>
        ${v.saferOption ? `<p><b>Better:</b> ${esc(v.saferOption)}</p>` : ""}
        ${w?.fairPrices?.length ? (s.showPrice ? `<div class="row"><span>They asked</span><input class="mini" id="num" style="width:90px" inputmode="decimal" aria-label="price"><span>USD</span><button class="chip" id="cmp">Compare</button></div>`
                                                : `<button class="link" id="addprice">They told me a price</button>`) : ""}
        ${w ? `<p class="small">From reports saved for New York${w.reports ? ` · ${w.reports} reports` : ""}</p><div class="small">${w.sources.map((u) => `<a href="${u.startsWith("https://") ? esc(u) : "#"}" target="_blank" rel="noopener">${esc(u.replace("https://", "").replace("www.", ""))}</a>`).join("<br>")}</div>` : ""}
        </div><button class="link" id="again">Scan something else</button>`,
    }[s.step];
    app.innerHTML = `<div class="screen"><button class="link" id="back">← Map</button><h1>Is this legit?</h1>
      ${s.photo ? `<img class="photo" src="${s.photo}" alt="Your photo">` : ""}${body()}</div>`;
    $("#back").onclick = () => home();
    $("#photo")?.addEventListener("change", (e) => takePhoto(e.target.files?.[0]));
    $("#type")?.addEventListener("click", () => { s.step = "describe"; draw(); });
    $("#again")?.addEventListener("click", () => scan());
    $("#check")?.addEventListener("click", () => { s.seen = $("#what").value.trim(); s.verdict = judge({ kind: "Other", text: s.seen }, ny.scams); s.badge = ""; s.step = "verdict"; draw(); });
    $("#addprice")?.addEventListener("click", () => { s.showPrice = true; draw(); });
    $("#cmp")?.addEventListener("click", () => {
      const n = parseNumber($("#num").value); if (n == null) return;
      const p = judge({ kind: w.kind, price: { currency: "USD", amount: n } }, [w]);
      if (p.warning) s.verdict = { ...s.verdict, verdict: p.verdict === "fair" ? s.verdict.verdict : p.verdict, why: `${p.why} ${w.whatHappens || ""}`.trim() };
      s.showPrice = false; draw();
    });
  };
  async function takePhoto(file) {
    if (!file) return;
    s.photo = URL.createObjectURL(file);
    if (!sample || !canReadPhotos) { s.step = "describe"; s.note = "Photo checking isn't available here, so say what you see."; return draw(); }
    s.step = "reading"; draw();
    try {
      const list = ny.scams.map((x) => `${x.id}: ${x.title} — looks like: ${(x.looksLike || x.signs || []).join("; ")}`).join("\n");
      const r = await sample(`A traveler in New York took this photo and wants to know if it's a scam. Compare it ONLY with this list of scams reported in New York:
${list}
Pick the one item the photo clearly shows, or "none" if it shows none of them. Don't guess from a weak resemblance.
Return ONLY JSON: {"match":"<id or none>","seen":"what is in the photo, max 15 words","kind":"Money|Taxi|Tour|Shop|Ticket|Other"}`, { images: [file], modelTier: "default", cache: false });
      const t = r.text || "", a = JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}") + 1));
      const hit = ny.scams.find((x) => x.id === a.match);
      s.seen = String(a.seen || "").slice(0, 120); s.badge = "Checked by Claude";
      s.verdict = hit ? verdictOf(hit) : { verdict: "unknown", why: LABEL.unknown, whatToDo: TIP[KINDS.includes(a.kind) ? a.kind : "Other"], saferOption: "", warning: null };
      s.step = "verdict";
    } catch { s.step = "describe"; s.note = "Couldn't check the photo. Say what you see."; }
    draw();
  }
  draw();
}

// ---------- SOS: write a clear message to copy into your messages app ----------
function sos() {
  app.innerHTML = `<div class="screen"><button class="link" id="back">← Map</button><h1>What's happening?</h1>
    <textarea class="field" id="note" placeholder="A few words are enough"></textarea>
    <div class="chips">${["Being followed", "Feel unsafe", "Hurt", "Lost", "Robbed"].map((q) => `<button class="chip" data-pick="${q}">${q}</button>`).join("")}</div>
    <p class="small" id="err"></p>
    <div id="out"></div>
    <div class="grow"></div>
    <button class="btn" id="write">Write the message</button>
    <p class="small" style="text-align:center">In danger? Call 911.</p></div>`;
  const note = $("#note");
  $("#back").onclick = () => home();
  app.querySelectorAll("[data-pick]").forEach((b) => (b.onclick = () => { note.value = note.value.trim() ? `${note.value.trim()}, ${b.dataset.pick.toLowerCase()}` : b.dataset.pick; }));
  $("#write").onclick = async () => {
    const text = note.value.trim();
    if (!text) return ($("#err").textContent = "Type or tap what's happening first.");
    $("#write").disabled = true; $("#write").textContent = "Writing…";
    const near = nearestOf();
    let msg = null;
    if (sample) { try { msg = (await sample(`Rewrite this emergency note into a clear SOS text message for family. Max 50 words, plain text. Third person about "the traveler", in New York near ${near.name}.
Keep every fact; add none. End with: "Call them now. If there is no answer, call 911."
Note: "${text}"`, { modelTier: "quick", cache: false })).text?.trim(); } catch {} }
    msg ||= `SOS from New York, near ${near.name}: ${text}. Call them now. If there is no answer, call 911.`;
    $("#out").innerHTML = `<div class="card col"><div class="label">Your message</div><textarea class="field" id="draft" style="height:140px"></textarea><button class="btn red" id="copy">Copy to send</button></div>`;
    $("#draft").value = msg;
    $("#copy").onclick = () => copy($("#draft").value);
    $("#write").remove();
  };
}

home();
</script>
</body>
